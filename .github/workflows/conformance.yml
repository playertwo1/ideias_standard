name: Conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit and adversarial fixtures
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Self-check Standard
        run: python scripts/validate_standard.py --self-check --json > self-check.json

      - name: Validate positive reference project
        run: python scripts/validate_standard.py examples/standard-android-ai/project-manifest.json --json > project-check.json

      - name: Run Gold check
        run: python scripts/check.py examples/gold-standard --json > gold-check.json

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.python-version }}
          path: |
            self-check.json
            project-check.json
            gold-check.json
          if-no-files-found: warn
