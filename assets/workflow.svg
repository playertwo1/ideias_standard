<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 200" width="100%" height="100%">
  <defs>
    <linearGradient id="wf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="node-accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="node-accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="node-accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="node-accent4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="node-accent5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="node-accent6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1120" height="200" rx="14" fill="url(#wf-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Connecting line -->
  <line x1="80" y1="100" x2="1040" y2="100" stroke="#334155" stroke-width="3" stroke-dasharray="6 6" />

  <!-- Step 1: Init -->
  <g transform="translate(40, 42)">
    <rect width="150" height="116" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <rect x="0" y="0" width="150" height="4" rx="2" fill="url(#node-accent1)" />
    <circle cx="28" cy="28" r="14" fill="#0369a1" />
    <text x="28" y="33" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">1</text>
    <text x="50" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">INÍCIO</text>
    <text x="14" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Scaffold Rápido</text>
    <text x="14" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">init.py em 1 linha</text>
    <text x="14" y="102" fill="#64748b" font-family="monospace" font-size="10">template/ injetado</text>
  </g>

  <!-- Step 2: Vision -->
  <g transform="translate(220, 42)">
    <rect width="150" height="116" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <rect x="0" y="0" width="150" height="4" rx="2" fill="url(#node-accent2)" />
    <circle cx="28" cy="28" r="14" fill="#4338ca" />
    <text x="28" y="33" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">2</text>
    <text x="50" y="32" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">ALINHAMENTO</text>
    <text x="14" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Visão &amp; MVP</text>
    <text x="14" y="86" fill="#94a3b8" font-family="monospace" font-size="11">PROJECT.md</text>
    <text x="14" y="102" fill="#64748b" font-family="monospace" font-size="10">ROADMAP.md</text>
  </g>

  <!-- Step 3: Spec -->
  <g transform="translate(400, 42)">
    <rect width="150" height="116" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <rect x="0" y="0" width="150" height="4" rx="2" fill="url(#node-accent3)" />
    <circle cx="28" cy="28" r="14" fill="#7e22ce" />
    <text x="28" y="33" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">3</text>
    <text x="50" y="32" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">DEFINIÇÃO</text>
    <text x="14" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Especificação</text>
    <text x="14" y="86" fill="#94a3b8" font-family="monospace" font-size="11">FEATURE.md</text>
    <text x="14" y="102" fill="#64748b" font-family="monospace" font-size="10">Critérios AC-01...</text>
  </g>

  <!-- Step 4: Build -->
  <g transform="translate(580, 42)">
    <rect width="150" height="116" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
    <rect x="0" y="0" width="150" height="4" rx="2" fill="url(#node-accent4)" />
    <circle cx="28" cy="28" r="14" fill="#b45309" />
    <text x="28" y="33" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">4</text>
    <text x="50" y="32" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">EXECUÇÃO</text>
    <text x="14" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Builder Guiado</text>
    <text x="14" y="86" fill="#94a3b8" font-family="monospace" font-size="11">AGENTS.md</text>
    <text x="14" y="102" fill="#64748b" font-family="monospace" font-size="10">WATCHDOG.md</text>
