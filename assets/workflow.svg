  <g transform="translate(760, 42)">
    <rect width="150" height="116" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <rect x="0" y="0" width="150" height="4" rx="2" fill="url(#node-accent5)" />
    <circle cx="28" cy="28" r="14" fill="#047857" />
    <text x="28" y="33" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">5</text>
    <text x="50" y="32" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">VERIFICAÇÃO</text>
    <text x="14" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Portão de Aceite</text>
    <text x="14" y="86" fill="#94a3b8" font-family="monospace" font-size="11">AUDIT.md (PASS)</text>
    <text x="14" y="102" fill="#64748b" font-family="monospace" font-size="10">RELEASE_CHECKLIST</text>
  </g>

  <!-- Step 6: State -->
  <g transform="translate(940, 42)">
    <rect width="140" height="116" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1" />
    <rect x="0" y="0" width="140" height="4" rx="2" fill="url(#node-accent6)" />
    <circle cx="28" cy="28" r="14" fill="#1d4ed8" />
    <text x="28" y="33" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">6</text>
    <text x="50" y="32" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">RETOMADA</text>
    <text x="14" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Estado Próximo</text>
